# ================================================================
#  PostgreSQL settings - only used when the "postgres" profile is on
#  (Eclipse: Run Configurations > Arguments > Program arguments:
#     --spring.profiles.active=postgres )
# ================================================================

# Where the database is: host:port/database-name
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant

# Development login. These match docker-compose.yml.
# NEVER put a real password here and push it to GitHub.
spring.datasource.username=restaurant
spring.datasource.password=restaurant

# Create/update tables automatically from the @Entity classes,
# keeping existing data between restarts.
spring.jpa.hibernate.ddl-auto=update
