# ================================================================
#  Default settings (used when you just press Run)
# ================================================================
spring.application.name=restaurant-reservation

# DEFAULT DATABASE = H2, a small database that lives inside the app.
# No install needed, so everyone can run the project right away.
# Data is wiped every time the app restarts.
# To use PostgreSQL instead, run with the "postgres" profile (see README).

# Create/update database tables automatically from our @Entity classes.
spring.jpa.hibernate.ddl-auto=update

# Don't keep database sessions open while web pages render.
# (Spring's recommended setting; avoids slow, surprising queries.)
spring.jpa.open-in-view=false

# Load the sample restaurant (9 tables, 3 reservations, 3 waitlisted
# parties) when the database is empty. Set to false to start blank.
app.sample-data=true
